# Supplier / brand master list for the Linda Ordering Dashboard.
#
# Extracted from the 16 named supplier worksheets in
# "Linda New Ordering Spreadsheet 08_19_2026.xlsx". The reference workbook's
# own tab colors were sparse and inconsistent across these sheets (most had
# no tab color at all, and the ones that did mostly shared the same faint
# theme tint) -- see sample_data/_extract for the raw survey. Rather than
# reproduce that inconsistency, each supplier here is assigned one color
# from a restrained, professional, colorblind-considerate palette so the
# dashboard has a consistent, recognizable identity per supplier.
#
# `product_master_source_sheet` is the reference workbook tab this supplier's
# product/vendor rows were extracted from (see config/product_master.csv and
# config/product_master_extraction_audit.json for the extraction detail).

